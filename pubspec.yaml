name: lingora
description: "Dilbaz - kısa günlük derslerle dil öğrenme uygulaması."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.3.3
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  timezone: ^0.11.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/courses/
    - assets/courses/tr_en/
    # Exam study paths (LGS, YDS/YÖKDİL); see lib/data/exam_path.dart.
    - assets/courses/exam_lgs/
    - assets/courses/exam_yds/
    - assets/exams/
    - assets/exam_packs/
    - assets/notes/
    - assets/pronunciation/
    - assets/reading/
    - assets/placement/
    - assets/vocab/
    - assets/mascot/
    - assets/flags/
    - assets/brand/
    # Topic themes (tool/themes/gen_theme_svgs.mjs, docs/tasarim/temalar.md).
    - assets/themes/aile/
    - assets/themes/alisveris/
    - assets/themes/cay/
    - assets/themes/dedektif/
    - assets/themes/doga/
    - assets/themes/duygular/
    - assets/themes/gecmis/
    - assets/themes/gunluk/
    - assets/themes/haber/
    - assets/themes/hava/
    - assets/themes/hayaller/
    - assets/themes/is/
    - assets/themes/kod/
    - assets/themes/kutuphane/
    - assets/themes/mulakat/
    - assets/themes/olasilik/
    - assets/themes/otel/
    - assets/themes/saglik/
    - assets/themes/sahne/
    - assets/themes/sanat/
    - assets/themes/sehir/
    - assets/themes/seyahat/
    - assets/themes/spor/
    - assets/themes/tamir/
    - assets/themes/teknoloji/
    - assets/themes/toplanti/
    - assets/themes/yazisma/
    - assets/themes/yemek/
    - assets/themes/zaman/

  # Inter (SIL OFL 1.1, assets/fonts/Inter-OFL.txt). "LingoraSans" is the
  # adult-mode family: the heavy weights map to Bold so headings stay calm.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: LingoraSans
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 900

# App icon: the Çaycı Dayı mascot (owner-supplied, see docs/assets.md).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F17F04"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#F17F04"
    theme_color: "#F17F04"
