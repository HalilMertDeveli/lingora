name: Storage

# Course audio (docs/ses.md): storage.rules and the app's download path
# against the Firebase Storage emulator (demo-lingora). Never the real bucket.

on:
  pull_request:
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'lib/core/voice_manifest.dart'
      - 'lib/services/voice_store.dart'
      - 'lib/services/voice_library.dart'
      - 'test/voice_storage_emulator_test.dart'
      - '.github/workflows/storage.yml'
  workflow_dispatch:

concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Rules and download (Storage emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Cache emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.35.0

      - run: npm install -g firebase-tools@15.35.0
      - run: flutter pub get

      - name: Storage emulator tests
        run: firebase emulators:exec --only storage --project demo-lingora "flutter test test/voice_storage_emulator_test.dart"
