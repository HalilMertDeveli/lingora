name: Auth E2E

# Giriş ve ilerleme akışları: Android emülatöründe integration_test, Firebase
# Emulator Suite'e (demo-lingora) bağlı. Gerçek projeye hiç bağlanmaz.
# Ayrıntılar: docs/giris-testleri.md.

on:
  pull_request:
    paths:
      - 'lib/services/firebase/**'
      - 'lib/services/billing/**'
      - 'lib/screens/auth_screen.dart'
      - 'lib/screens/account_section.dart'
      - 'lib/data/progress.dart'
      - 'integration_test/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/auth-e2e.yml'
  workflow_dispatch:

concurrency:
  group: auth-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Sign-in flows (Android + Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      # Android emülatörü için donanım hızlandırma.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Firestore emülatörü ve Gradle Java ister.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Cache emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.35.0

      - run: npm install -g firebase-tools@15.35.0
      - run: flutter pub get

      - name: Integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # emulators:exec runs the command once the emulators are up; the curl
          # checks make that explicit (host side), and the test itself waits
          # for 10.0.2.2:9099/8080 from the device (Emulators.waitReady).
          script: firebase emulators:exec --only auth,firestore --project demo-lingora "curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:9099/emulator/v1/projects/demo-lingora/config && curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8080/ && flutter test integration_test/auth_flows_test.dart -d emulator-5554"
